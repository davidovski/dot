[font]
size = 10.0

[font.normal]
family = "FiraMono Nerd Font"
style = "Regular"

[window]
decorations = "None"
opacity = 1.0
blur = false

[window.padding]
x = 12
y = 12

[colors.primary]
background = "#191919"
foreground = "#fefefe"

[colors.cursor]
text = "CellBackground"
cursor = "#fefefe"

[colors.normal]
black   = "#282a2e"
red     = "#a54242"
green   = "#8c9440"
yellow  = "#de935f"
blue    = "#5f819d"
magenta = "#85678f"
cyan    = "#5e8d87"
white   = "#707880"

[colors.bright]
black   = "#373b41"
red     = "#cc6666"
green   = "#b5bd68"
yellow  = "#f0c674"
blue    = "#81a2be"
magenta = "#b294bb"
cyan    = "#b4d6d1"
white   = "#c5c8c6"

